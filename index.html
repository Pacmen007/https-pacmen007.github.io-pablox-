<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pablox - Redes Sociales</title>
    <!-- Importar FontAwesome para los logos de las redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Fondo con tu logo cubriendo toda la página y capa oscura translúcida */
            background: linear-gradient(rgba(11, 12, 16, 0.90), rgba(11, 12, 16, 0.90)), url('1000012163.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
            scroll-behavior: smooth;
        }
        /* Barra de Navegación */
        .navbar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 25px;
            padding: 15px 20px;
            background-color: rgba(13, 17, 23, 0.9);
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 1000;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .navbar::-webkit-scrollbar {
            display: none;
        }
        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }
        .navbar a:hover, .navbar a.active {
            color: #ffcc00;
        }
        .header {
            text-align: center;
            padding: 40px 0 10px 0;
        }
        .header h1 {
            color: #ffcc00;
            font-size: 48px;
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .section-title {
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 40px 0 20px 0;
        }
        /* Contenedor de Botones de Redes Sociales */
        .social-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .btn-social {
            background-color: rgba(13, 17, 23, 0.9);
            border: 2px solid #3b82f6;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 16px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }
        .btn-social:hover {
            transform: scale(1.05);
            background-color: #3b82f6;
            border-color: #ffcc00;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar">
        <a href="index.html">INICIO</a>
        <a href="lanzamientos.html">LANZAMIENTOS</a>
        <a href="redes.html" class="active">REDES</a>
        <a href="sobre-mi.html">SOBRE MÍ</a>
    </nav>

    <!-- ENCABEZADO -->
    <header class="header">
        <h1>pablox</h1>
    </header>

    <!-- SECCIÓN REDES SOCIALES -->
    <h2 class="section-title">REDES SOCIALES</h2>

    <div class="social-container">
        <a href="https://www.instagram.com/pablox_oficial" target="_blank" class="btn-social">
            <i class="fa-brands fa-instagram" style="font-size: 20px;"></i> Instagram
        </a>
        <a href="https://www.tiktok.com/@oficial_pablox" target="_blank" class="btn-social">
            <i class="fa-brands fa-tiktok" style="font-size: 20px;"></i> TikTok
        </a>
        <a href="https://www.youtube.com/@pablox25" target="_blank" class="btn-social">
            <i class="fa-brands fa-youtube" style="font-size: 20px; color: #ff0000;"></i> YouTube
        </a>
        <a href="https://open.spotify.com/artist/pablox" target="_blank" class="btn-social">
            <i class="fa-brands fa-spotify" style="font-size: 20px; color: #1DB954;"></i> Spotify
        </a>
    </div>

</body>
</html>
