<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pablox | LA X-GANG</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 50% 15%,#28104d 0%,transparent 35%),
        linear-gradient(135deg,#090712,#18091f,#080b14);

    overflow-x:hidden;
}

/* =========================
   MENÚ
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;

    z-index:1000;

    background:rgba(7,8,16,.97);

    border-bottom:2px solid #873cff;

    box-shadow:0 0 20px rgba(123,44,255,.4);
}

nav{
    width:100%;
    height:100%;

    overflow-x:auto;
    white-space:nowrap;

    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav ul{
    height:100%;

    display:flex;
    align-items:center;

    list-style:none;
}

nav li{
    height:100%;
}

nav a{
    height:100%;

    display:flex;
    align-items:center;

    padding:0 20px;

    color:white;

    text-decoration:none;

    font-size:17px;
    font-weight:900;

    letter-spacing:1px;

    transition:.3s;
}

nav a:hover,
nav a.active{
    color:#ff2d6f;
}

/* =========================
   PÁGINAS
========================= */

.page{
    display:none;

    min-height:100vh;

    padding:
        115px
        20px
        70px;

    width:100%;
    max-width:1100px;

    margin:auto;
}

.page.active{
    display:flex;

    flex-direction:column;

    align-items:center;
}

/* =========================
   INICIO
========================= */

#inicio{
    justify-content:center;
    text-align:center;
}

.logo-pablox{
    font-size:
        clamp(3.5rem,15vw,7rem);

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #963cff,
            #d86cff,
            #7b2cff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 30px rgba(157,76,255,.5);

    margin-bottom:20px;
}

.descripcion{
    max-width:700px;

    color:#d6d1df;

    font-size:1.15rem;

    text-align:center;

    margin-bottom:35px;
}

/* =========================
   TITULOS
========================= */

.titulo{
    text-align:center;

    font-size:
        clamp(2rem,8vw,3.8rem);

    font-weight:900;

    letter-spacing:5px;

    margin-bottom:15px;

    text-shadow:
        0 0 10px #8d43ff,
        0 0 30px rgba(141,67,255,.7);
}

.subtitulo{
    color:#d5d1df;

    text-align:center;

    font-size:1.1rem;

    margin-bottom:30px;
}

/* =========================
   BOTONES
========================= */

.btn{
    display:inline-flex;

    justify-content:center;
    align-items:center;

    padding:13px 32px;

    min-width:180px;

    border-radius:30px;

    border:3px solid #ddd;

    text-decoration:none;

    color:white;

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #ae45ff,
            #7934ed
        );

    box-shadow:
        0 0 15px rgba(168,68,255,.7);

    cursor:pointer;

    transition:.3s;
}

.btn:hover{
    transform:scale(1.04);

    box-shadow:
        0 0 28px #9d4cff;
}

/* =========================
   TARJETAS
========================= */

.cards{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:22px;
}

.card{
    background:rgba(18,15,35,.95);

    border:3px solid #45247c;

    border-radius:25px;

    padding:18px;

    text-align:center;

    box-shadow:
        0 0 18px rgba(103,48,170,.25);

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);

    border-color:#8c43ff;

    box-shadow:
        0 0 25px rgba(140,67,255,.5);
}

/* =========================
   PORTADAS
========================= */

.cover{
    width:100%;

    aspect-ratio:1/1;

    border-radius:18px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:55px;

    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            #6500ff,
            #df32a6
        );

    box-shadow:
        0 0 25px rgba(157,76,255,.35);
}

.card h3{
    font-size:1.25rem;

    margin-bottom:5px;
}

.card p{
    color:#c9c4d4;
}

/* =========================
   BOTÓN CARD
========================= */

.card .btn{
    margin-top:15px;

    min-width:150px;

    padding:10px 20px;

    font-size:.9rem;
}

/* =========================
   VIDEOCLIPS
========================= */

.badge{
    display:inline-block;

    background:#ffc400;

    color:#111
