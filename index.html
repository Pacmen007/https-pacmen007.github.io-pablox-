<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Escáner de Entradas</title>
  <!-- Tailwind CSS para un diseño moderno y adaptable a móviles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería Html5-QRCode para el acceso a la cámara real -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Encabezado -->
  <header class="w-full max-w-md text-center py-4">
    <h1 class="text-2xl font-bold tracking-wide">Control de Acceso</h1>
    <p class="text-xs text-slate-400">Panel exclusivo para administradores</p>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-md flex flex-col items-center flex-grow justify-center space-y-6">
    
    <!-- Botón Inicial para Activar la Cámara -->
    <div id="start-section" class="w-full text-center">
      <button onclick="iniciarEscaner()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Abrir Cámara y Escanear</span>
      </button>
    </div>

    <!-- Visor de la Cámara (Oculto inicialmente) -->
    <div id="scanner-container" class="w-full hidden flex flex-col items-center space-y-4">
      <div id="reader" class="w-full rounded-xl overflow-hidden border-2 border-emerald-500 shadow-2xl bg-black"></div>
      <button onclick="detenerEscaner()" class="text-sm text-red-400 hover:text-red-300 underline font-medium">
        Cerrar Cámara / Volver
      </button>
    </div>

    <!-- Panel de Resultado y Gestión de la Entrada -->
    <div id="result-card" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl hidden space-y-4">
      <div class="flex items-center justify-between">
        <span id="badge-estado" class="px-3 py-1 text-xs font-semibold rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">Activa</span>
        <span id="ticket-id" class="text-xs text-slate-400 font-mono">ID: --</span>
      </div>

      <div class="space-y-1">
        <h2 id="attendee-name" class="text-xl font-bold text-white">Nombre de la Persona</h2>
        <p class="text-sm text-slate-300">Tipo de entrada: <span id="ticket-type" class="text-white font-medium">General</span></p>
      </div>

      <!-- Botón de Desactivación Manual por el Administrador -->
      <button id="btn-desactivar" onclick="desactivarEntradaActual()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl shadow transition transform active:scale-95 flex items-center justify-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span>Desactivar Entrada Manualmente</span>
      </button>

      <!-- Botón para escanear otra entrada -->
      <button onclick="reiniciarEscaneo()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
        Escanear Siguiente Entrada
      </button>
      
      <div id="action-feedback" class="text-center text-sm font-medium"></div>
    </div>

  </main>

  <!-- Pie de página -->
  <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
    Sistema de Validación Oficial
  </footer>

  <!-- Script de Control -->
  <script>
    let html5QrCode = null;
    let entradaActualToken = null;

    function iniciarEscaner() {
      document.getElementById('start-section').classList.add('hidden');
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('scanner-container').classList.remove('hidden');

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        alert("No se pudo acceder a la cámara. Comprueba los permisos en tu navegador.");
        detenerEscaner();
      });
    }

    function detenerEscaner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          document.getElementById('scanner-container').classList.add('hidden');
          document.getElementById('start-section').classList.remove('hidden');
        }).catch(err => {
          document.getElementById('scanner-container').classList.add('hidden');
          document.getElementById('start-section').classList.remove('hidden');
        });
      } else {
        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('start-section').classList.remove('hidden');
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      entradaActualToken = decodedText;
      
      if (navigator.vibrate) navigator.vibrate(100);

      // Datos de prueba (aquí conectarías con tu base de datos real)
      mostrarDatosEntrada({
        token: decodedText,
        nombre: "Invitado Verificado",
        tipo: "Acceso General",
        estado: "activa"
      });

      // Detener cámara al detectar con éxito
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(err => console.log(err));
      }
      document.getElementById('scanner-container').classList.add('hidden');
    }

    function onScanFailure(error) {
      // Ignorar errores de fotogramas por segundo para mantener la lectura fluida
    }

    function mostrarDatosEntrada(datos) {
      document.getElementById('ticket-id').innerText = "ID: " + datos.token.substring(0, 8) + "...";
      document.getElementById('attendee-name').innerText = datos.nombre;
      document.getElementById('ticket-type').innerText = datos.tipo;
      
      const badge = document.getElementById('badge-estado');
      const btnDesactivar = document.getElementById('btn-desactivar');
      
      // La entrada se muestra ACTIVA hasta que el admin decida desactivarla manualmente
      badge.innerText = "Activa";
      badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      
      btnDesactivar.disabled = false;
      btnDesactivar.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-700');
      btnDesactivar.classList.add('bg-red-600', 'hover:bg-red-500');
      btnDesactivar.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span>Desactivar Entrada Manualmente</span>
      `;

      document.getElementById('action-feedback').innerText = "";
      document.getElementById('result-card').classList.remove('hidden');
    }

    function desactivarEntradaActual() {
      // Acción de desactivar la entrada del usuario actual de forma manual
      const badge = document.getElementById('badge-estado');
      const btnDesactivar = document.getElementById('btn-desactivar');
      
      badge.innerText = "Desactivada / Usada";
      badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-red-500/20 text-red-400 border border-red-500/30";
      
      btnDesactivar.disabled = true;
      btnDesactivar.classList.remove('bg-red-600', 'hover:bg-red-500');
      btnDesactivar.classList.add('bg-slate-700', 'opacity-50', 'cursor-not-allowed');
      
      document.getElementById('action-feedback').innerHTML = "<span class='text-red-400 font-semibold'>✔ Entrada desactivada correctamente. Ya no se podrá volver a usar.</span>";

      // Aquí puedes colocar tu petición fetch() para guardar el estado en tu base de datos:
      // fetch('/api/desactivar', { method: 'POST', body: JSON.stringify({ token: entradaActualToken }) });
    }

    function reiniciarEscaneo() {
      document.getElementById('result-card').classList.add('hidden');
      iniciarEscaner();
    }
  </script>
</body>
</html>
