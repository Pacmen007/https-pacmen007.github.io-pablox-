<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pablox - Sitio Oficial</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Encabezado -->
  <header class="w-full max-w-md text-center py-6">
    <h1 class="text-3xl font-bold tracking-wide">pablox</h1>
    <p class="text-sm text-slate-400">LA X-GANG</p>
  </header>

  <!-- Contenido Principal -->
  <main class="w-full max-w-md flex flex-col items-center flex-grow justify-center space-y-6">
    
    <!-- Sección de Entradas / Conciertos (Sin escáner) -->
    <section class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <h2 class="text-xl font-bold text-white">Próximos Eventos y Entradas</h2>
      <p class="text-sm text-slate-300">Consigue tus acceso oficiales para los próximos conciertos en Manzanares.</p>
      
      <div class="pt-2">
        <a href="#" class="inline-block w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow transition transform active:scale-95">
          Comprar / Ver Entradas
        </a>
      </div>
    </section>

  </main>

  <!-- Pie de página -->
  <footer class="w-full max-w-md text-center py-4 text-xs text-slate-500">
    © 2026 pablox - Todos los derechos reservados.
  </footer>

</body>
</html>
